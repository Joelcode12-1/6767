<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="sunsetSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="30%" stop-color="#312e81" />
      <stop offset="60%" stop-color="#4f46e5" />
      <stop offset="85%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
    <linearGradient id="mtnFar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="mtnNear" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="snowCap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fda4af" />
    </linearGradient>
    <linearGradient id="lakeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.7"/>
      <stop offset="30%" stop-color="#4f46e5" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
  </defs>

  <!-- Dramatic Sunset Sky -->
  <rect width="800" height="340" fill="url(#sunsetSky)" />
  
  <!-- Glowing Sun disc behind mountains -->
  <circle cx="560" cy="220" r="45" fill="#fef08a" opacity="0.9" />
  
  <!-- Distant Mountain Peaks -->
  <polygon points="350,260 480,120 600,260" fill="url(#mtnFar)" opacity="0.8" />
  <polygon points="480,120 450,165 470,180 480,155 495,175 510,160" fill="url(#snowCap)" />

  <polygon points="520,260 650,90 790,260" fill="url(#mtnFar)" opacity="0.8" />
  <polygon points="650,90 615,145 640,160 650,135 670,160 685,135" fill="url(#snowCap)" />

  <!-- Foreground Alpine Peaks -->
  <polygon points="400,340 550,140 700,340" fill="url(#mtnNear)" />
  <polygon points="550,140 515,190 535,210 550,185 570,215 585,185" fill="url(#snowCap)" />

  <polygon points="620,340 730,170 820,340" fill="#090d16" />

  <!-- Pine Silhouettes on Ridge -->
  <polygon points="460,340 465,300 470,340" fill="#020617"/>
  <polygon points="475,340 482,290 490,340" fill="#020617"/>
  <polygon points="505,340 512,305 520,340" fill="#020617"/>
  <polygon points="670,340 677,295 685,340" fill="#020617"/>

  <!-- Mirror Lake Water -->
  <rect y="330" width="800" height="170" fill="url(#lakeGrad)" />
  
  <!-- Water Reflection Ripples -->
  <ellipse cx="560" cy="360" rx="120" ry="6" fill="#fde047" opacity="0.4" />
  <ellipse cx="560" cy="385" rx="160" ry="5" fill="#fb923c" opacity="0.3" />
  <ellipse cx="560" cy="415" rx="200" ry="4" fill="#f43f5e" opacity="0.25" />

  <!-- Header UI Overlay -->
  <text x="50" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" fill="#ffffff" letter-spacing="1">WANDERLY</text>
  <text x="195" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13" fill="#cbd5e1">Destinations</text>
  <text x="290" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13" fill="#cbd5e1">Expeditions</text>
  <text x="385" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13" fill="#cbd5e1">Stories</text>

  <!-- Left Copy & Bold Messaging -->
  <text x="50" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#ffffff">EXPLORE</text>
  <text x="50" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#fde047">THE WORLD</text>
  
  <text x="50" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="15" fill="#f1f5f9">Immersive cinematic expeditions and backcountry guides</text>
  <text x="50" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="15" fill="#f1f5f9">for the modern explorer seeking untouched nature.</text>

  <!-- Feature Pills -->
  <g transform="translate(50, 315)">
    <rect width="120" height="32" rx="16" fill="rgba(15,23,42,0.6)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="18" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ffffff">▶ 4K HDR Films</text>
    
    <rect x="130" width="135" height="32" rx="16" fill="rgba(15,23,42,0.6)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="145" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#fda4af">⛰ 32 Mountain Treks</text>
  </g>

  <!-- CTA Button -->
  <rect x="50" y="375" width="170" height="44" rx="22" fill="#f43f5e" />
  <text x="75" y="403" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14" fill="#ffffff">Watch Expedition →</text>
</svg>
