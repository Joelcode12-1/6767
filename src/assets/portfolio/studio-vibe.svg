<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="warmStudioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="60%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="50%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <radialGradient id="lampCone" cx="30%" cy="10%" r="90%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Studio Wall Background -->
  <rect width="800" height="500" fill="url(#warmStudioBg)" />

  <!-- Lamp Cone Light -->
  <polygon points="560,0 420,380 780,380 620,0" fill="url(#lampCone)" />

  <!-- Concrete / Brick Texture Lines on Wall -->
  <line x1="0" y1="120" x2="800" y2="120" stroke="#3f3f46" stroke-width="1" stroke-dasharray="8 12" opacity="0.4"/>
  <line x1="0" y1="240" x2="800" y2="240" stroke="#3f3f46" stroke-width="1" stroke-dasharray="8 12" opacity="0.4"/>

  <!-- Agency Brand Header Overlay -->
  <text x="50" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="20" fill="#ffffff">STUDIO<tspan fill="#f59e0b">VIBE</tspan></text>
  <text x="180" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13" fill="#a1a1aa">Work</text>
  <text x="240" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13" fill="#a1a1aa">Services</text>
  <text x="315" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13" fill="#a1a1aa">Manifesto</text>

  <!-- Left Copy -->
  <text x="50" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="40" fill="#ffffff">Designing</text>
  <text x="50" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="40" fill="#f59e0b">Better Tomorrows</text>
  
  <text x="50" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="15" fill="#a1a1aa">High-impact brand strategy and bespoke interactive design</text>
  <text x="50" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="15" fill="#a1a1aa">for category-defining founders and forward-thinking studios.</text>

  <!-- Moodboard Tags -->
  <g transform="translate(50, 315)">
    <rect width="110" height="32" rx="16" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
    <text x="18" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#fde68a">✦ Visual Identity</text>
    
    <rect x="120" width="125" height="32" rx="16" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
    <text x="135" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#c084fc">❖ Creative Tech</text>
  </g>

  <!-- CTA Button -->
  <rect x="50" y="375" width="165" height="44" rx="22" fill="#f59e0b" />
  <text x="80" y="403" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14" fill="#18181b">View Case Study →</text>

  <!-- Scandinavian Oak Desk on Right -->
  <polygon points="410,350 800,350 800,500 370,500" fill="url(#deskGrad)" />
  <line x1="410" y1="350" x2="800" y2="350" stroke="#b45309" stroke-width="3" />

  <!-- Ultra-wide Curved Monitor Showcase -->
  <!-- Monitor Stand -->
  <rect x="585" y="310" width="30" height="42" fill="#3f3f46" />
  <ellipse cx="600" cy="350" rx="35" ry="8" fill="#52525b" />
  
  <!-- Monitor Bezel with Curved Frame -->
  <rect x="470" y="150" width="260" height="160" rx="10" fill="#18181b" stroke="#3f3f46" stroke-width="3" />
  <!-- Screen Content with Figma / UI Layout -->
  <rect x="478" y="158" width="244" height="144" rx="6" fill="#09090b" />
  <!-- Artboard previews on screen -->
  <rect x="490" y="170" width="95" height="120" rx="4" fill="url(#screenGrad)" opacity="0.9" />
  <rect x="595" y="170" width="115" height="55" rx="4" fill="#1e1e24" stroke="#3b82f6" stroke-width="1" />
  <rect x="595" y="235" width="115" height="55" rx="4" fill="#1e1e24" stroke="#8b5cf6" stroke-width="1" />
  <!-- UI wires -->
  <line x1="535" y1="210" x2="595" y2="195" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Minimalist Keyboard & Mouse on Desk -->
  <rect x="520" y="365" width="120" height="35" rx="4" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <ellipse cx="665" cy="380" rx="10" ry="16" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>

  <!-- Ceramic Coffee Mug -->
  <ellipse cx="465" cy="380" rx="14" ry="12" fill="#d4d4d8" />
  <ellipse cx="465" cy="380" rx="10" ry="8" fill="#52525b" />
  <!-- Steam -->
  <path d="M465,365 Q470,350 465,340" stroke="#f4f4f5" stroke-width="1.5" fill="none" opacity="0.4"/>
</svg>
