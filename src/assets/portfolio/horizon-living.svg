<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="40%" stop-color="#1e293b" />
      <stop offset="75%" stop-color="#334155" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="poolGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="40%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="villaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#bae6fd" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.4" />
    </linearGradient>
    <filter id="blurGlow">
      <feGaussianBlur stdDeviation="15" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sky & Twilight Background -->
  <rect width="800" height="500" fill="url(#skyGrad)" />
  
  <!-- Subtle Stars -->
  <circle cx="120" cy="40" r="1.5" fill="#ffffff" opacity="0.8" />
  <circle cx="280" cy="65" r="1.2" fill="#ffffff" opacity="0.6" />
  <circle cx="450" cy="30" r="1.8" fill="#ffffff" opacity="0.9" />
  <circle cx="620" cy="55" r="1" fill="#ffffff" opacity="0.5" />
  <circle cx="730" cy="80" r="1.6" fill="#ffffff" opacity="0.7" />

  <!-- Distant Hills & Trees -->
  <path d="M0,260 Q200,230 400,250 T800,240 L800,500 L0,500 Z" fill="#0b1120" opacity="0.7"/>

  <!-- Modern Luxury Villa Structure -->
  <!-- Upper Floor Block -->
  <rect x="360" y="80" width="380" height="150" rx="4" fill="url(#villaGrad)" />
  <rect x="350" y="70" width="400" height="15" rx="2" fill="#0f172a" />
  
  <!-- Floor-to-ceiling Upper Windows with Warm Golden Interior Glow -->
  <rect x="380" y="95" width="160" height="120" fill="url(#glowGrad)" rx="2"/>
  <rect x="380" y="95" width="160" height="120" fill="url(#glassGrad)"/>
  <!-- Window mullions -->
  <line x1="433" y1="95" x2="433" y2="215" stroke="#1e293b" stroke-width="3" />
  <line x1="486" y1="95" x2="486" y2="215" stroke="#1e293b" stroke-width="3" />
  <!-- Interior silhouettes / light fixtures -->
  <circle cx="430" cy="120" r="18" fill="#fef08a" opacity="0.9" filter="url(#blurGlow)"/>
  <circle cx="500" cy="120" r="15" fill="#fef08a" opacity="0.8" filter="url(#blurGlow)"/>

  <!-- Upper Balcony Glass Railing -->
  <rect x="560" y="140" width="170" height="85" fill="url(#glassGrad)" stroke="#64748b" stroke-width="1.5" rx="2"/>
  <rect x="560" y="100" width="170" height="115" fill="url(#glowGrad)" opacity="0.85"/>
  <line x1="615" y1="100" x2="615" y2="215" stroke="#1e293b" stroke-width="2"/>
  <line x1="675" y1="100" x2="675" y2="215" stroke="#1e293b" stroke-width="2"/>

  <!-- Cantilever Overhang & Lower Level -->
  <rect x="320" y="225" width="440" height="20" fill="#1e293b" rx="2"/>
  <rect x="340" y="245" width="420" height="135" fill="#0f172a" />
  <!-- Lower Floor Glass Panes with Interior Lighting -->
  <rect x="360" y="255" width="370" height="115" fill="url(#glowGrad)" opacity="0.95"/>
  <rect x="360" y="255" width="370" height="115" fill="url(#glassGrad)"/>
  <line x1="450" y1="255" x2="450" y2="370" stroke="#0f172a" stroke-width="4"/>
  <line x1="550" y1="255" x2="550" y2="370" stroke="#0f172a" stroke-width="4"/>
  <line x1="650" y1="255" x2="650" y2="370" stroke="#0f172a" stroke-width="4"/>

  <!-- Architectural Columns -->
  <rect x="350" y="225" width="16" height="155" fill="#475569" />
  <rect x="740" y="225" width="16" height="155" fill="#475569" />

  <!-- Left Side Garden & Palm Trees -->
  <path d="M180,380 C180,270 140,210 110,170" stroke="#334155" stroke-width="10" stroke-linecap="round" fill="none"/>
  <!-- Palm Fronds -->
  <path d="M110,170 Q70,140 30,170 Q80,180 110,170" fill="#0f172a"/>
  <path d="M110,170 Q100,120 120,90 Q125,140 110,170" fill="#1e293b"/>
  <path d="M110,170 Q150,130 190,150 Q145,175 110,170" fill="#0f172a"/>
  <path d="M110,170 Q160,180 200,210 Q150,200 110,170" fill="#1e293b"/>

  <!-- Terrace Deck -->
  <polygon points="200,380 780,380 800,430 140,430" fill="#334155" />
  <line x1="140" y1="430" x2="800" y2="430" stroke="#475569" stroke-width="3" />

  <!-- Illuminated Infinity Swimming Pool -->
  <polygon points="210,395 760,395 780,475 160,475" fill="url(#poolGrad)" />
  <!-- Water Light Ripples & Highlights -->
  <ellipse cx="480" cy="425" rx="220" ry="20" fill="#38bdf8" opacity="0.3" filter="url(#blurGlow)" />
  <ellipse cx="460" cy="445" rx="180" ry="14" fill="#a5f3fc" opacity="0.35" filter="url(#blurGlow)" />
  <line x1="260" y1="420" x2="680" y2="420" stroke="#ffffff" stroke-width="1.5" opacity="0.4" stroke-dasharray="25 15"/>
  <line x1="230" y1="440" x2="710" y2="440" stroke="#ffffff" stroke-width="1.5" opacity="0.4" stroke-dasharray="35 20"/>

  <!-- Dark Pool Edge / Coping -->
  <polygon points="160,475 780,475 800,500 120,500" fill="#1e293b" />

  <!-- Modern Sun Loungers -->
  <path d="M640,405 L675,402 L690,392" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M645,410 L645,415 M670,407 L670,414" stroke="#64748b" stroke-width="2"/>
  
  <path d="M570,408 L605,405 L620,395" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M575,413 L575,418 M600,410 L600,417" stroke="#64748b" stroke-width="2"/>

  <!-- Top Dark Gradient Vignette for UI Overlay readability -->
  <rect width="800" height="160" fill="url(#skyGrad)" opacity="0.85" />
  
  <!-- Website Header UI Overlay -->
  <text x="40" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="20" fill="#ffffff" letter-spacing="0.5">Horizon Living</text>
  <text x="560" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13" fill="#cbd5e1">Home</text>
  <text x="615" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13" fill="#cbd5e1">Properties</text>
  <text x="695" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13" fill="#cbd5e1">Contact</text>

  <!-- Hero Typography Overlay on Project Card -->
  <text x="40" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="34" fill="#ffffff">Luxury Living</text>
  <text x="40" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="34" fill="#38bdf8">Beyond Ordinary</text>
  <text x="40" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="14" fill="#94a3b8">Architectural masterpieces crafted for sustainable elegance.</text>

  <!-- CTA pill -->
  <rect x="40" y="215" width="130" height="36" rx="18" fill="#38bdf8" />
  <text x="65" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#0f172a">View Properties →</text>
</svg>
