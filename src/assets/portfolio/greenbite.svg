<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bowlGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2d3748" />
      <stop offset="85%" stop-color="#1a202c" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>
    <linearGradient id="avocadoSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d5a27" />
      <stop offset="100%" stop-color="#1b3917" />
    </linearGradient>
    <linearGradient id="avocadoFlesh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bef264" />
      <stop offset="100%" stop-color="#84cc16" />
    </linearGradient>
    <linearGradient id="salmonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
  </defs>

  <!-- Dark Slate Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" />
  
  <!-- Subtle circular glow behind bowl -->
  <circle cx="620" cy="250" r="220" fill="#10b981" opacity="0.08" />

  <!-- Website Header UI Overlay -->
  <text x="50" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="20" fill="#10b981">GreenBite</text>
  <circle cx="160" cy="42" r="3" fill="#10b981" />
  <text x="175" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13" fill="#64748b">Menu</text>
  <text x="235" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13" fill="#64748b">Nutrition</text>
  <text x="310" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13" fill="#64748b">Order Now</text>

  <!-- Left Copy -->
  <text x="50" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="42" fill="#ffffff">Fresh Food</text>
  <text x="50" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="42" fill="#10b981">Better Life</text>
  
  <text x="50" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="15" fill="#94a3b8">Chef-prepared organic bowls delivered fresh to your door.</text>
  <text x="50" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="15" fill="#94a3b8">100% farm-to-table ingredients with zero preservatives.</text>

  <!-- Badges -->
  <g transform="translate(50, 315)">
    <rect width="115" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="18" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#a7f3d0">🌱 100% Organic</text>
    
    <rect x="125" width="105" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="142" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#fed7aa">⚡ 25m Delivery</text>
  </g>

  <!-- CTA Button -->
  <rect x="50" y="375" width="160" height="44" rx="22" fill="#10b981" />
  <text x="82" y="403" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14" fill="#042f2e">Explore Menu →</text>

  <!-- Gourmet Bowl Showcase on Right Side -->
  <!-- Bowl Shadow -->
  <ellipse cx="620" cy="265" rx="170" ry="170" fill="#000000" opacity="0.6" />
  <!-- Ceramic Dark Bowl -->
  <circle cx="615" cy="250" r="160" fill="url(#bowlGrad)" stroke="#374151" stroke-width="6" />
  
  <!-- Quinoa / Grain Base -->
  <circle cx="615" cy="250" r="142" fill="#d97706" opacity="0.35" />
  
  <!-- Fresh Greens / Spinach / Kale Leaves -->
  <path d="M505,190 C490,160 530,130 560,160 C580,180 540,210 505,190 Z" fill="#15803d" />
  <path d="M530,150 C550,120 590,140 585,170 C570,190 535,170 530,150 Z" fill="#22c55e" />
  <path d="M490,230 C470,200 510,180 535,210 C545,230 515,250 490,230 Z" fill="#16a34a" />

  <!-- Sliced Avocado Arc -->
  <g transform="translate(560, 260) rotate(-20)">
    <path d="M0,0 C15,-40 65,-40 80,0 C70,40 10,40 0,0 Z" fill="url(#avocadoSkin)" />
    <path d="M5,0 C18,-33 60,-33 73,0 C63,33 15,33 5,0 Z" fill="url(#avocadoFlesh)" />
    <line x1="15" y1="0" x2="65" y2="0" stroke="#facc15" stroke-width="2" opacity="0.6"/>
  </g>
  <g transform="translate(585, 275) rotate(-5)">
    <path d="M0,0 C15,-40 65,-40 80,0 C70,40 10,40 0,0 Z" fill="url(#avocadoSkin)" />
    <path d="M5,0 C18,-33 60,-33 73,0 C63,33 15,33 5,0 Z" fill="url(#avocadoFlesh)" />
  </g>
  <g transform="translate(615, 280) rotate(15)">
    <path d="M0,0 C15,-40 65,-40 80,0 C70,40 10,40 0,0 Z" fill="url(#avocadoSkin)" />
    <path d="M5,0 C18,-33 60,-33 73,0 C63,33 15,33 5,0 Z" fill="url(#avocadoFlesh)" />
  </g>

  <!-- Fresh Cherry Tomato Halves -->
  <ellipse cx="675" cy="190" rx="22" ry="20" fill="#dc2626" />
  <ellipse cx="675" cy="190" rx="16" ry="14" fill="#ef4444" />
  <circle cx="670" cy="186" r="3" fill="#fca5a5" />
  <circle cx="682" cy="192" r="3" fill="#fca5a5" />

  <ellipse cx="710" cy="235" rx="20" ry="18" fill="#dc2626" />
  <ellipse cx="710" cy="235" rx="14" ry="12" fill="#ef4444" />
  <circle cx="706" cy="232" r="2.5" fill="#fca5a5" />

  <!-- Diced Salmon / Protein Cubes -->
  <rect x="580" y="170" width="22" height="20" rx="4" fill="url(#salmonGrad)" />
  <rect x="610" y="165" width="24" height="22" rx="4" fill="url(#salmonGrad)" />
  <rect x="630" y="190" width="20" height="20" rx="4" fill="url(#salmonGrad)" />

  <!-- Roasted Chickpeas & Sesame Seeds -->
  <circle cx="560" cy="220" r="5" fill="#fde047" />
  <circle cx="575" cy="235" r="5.5" fill="#eab308" />
  <circle cx="550" cy="245" r="4.5" fill="#fde047" />
  <circle cx="650" cy="250" r="5" fill="#fde047" />
  <circle cx="670" cy="265" r="5.5" fill="#eab308" />

  <!-- Lime Wedge -->
  <path d="M680,310 A45,45 0 0,1 725,355 L680,355 Z" fill="#84cc16" />
  <path d="M685,315 A38,38 0 0,1 720,350 L685,350 Z" fill="#d9f99d" />
</svg>
