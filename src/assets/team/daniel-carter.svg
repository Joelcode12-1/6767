<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" width="100%" height="100%">
  <defs>
    <linearGradient id="dcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8d5536" />
      <stop offset="100%" stop-color="#6f3d23" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="300" height="340" fill="url(#dcBg)" rx="16" />

  <!-- Studio Ambient Light -->
  <circle cx="150" cy="130" r="110" fill="#475569" opacity="0.4" />

  <!-- Shoulders & Dark Black Sweater -->
  <path d="M50,340 C60,265 105,245 150,245 C195,245 240,265 250,340 Z" fill="#0f172a" />
  <!-- Crewneck collar -->
  <path d="M125,245 C135,260 165,260 175,245" stroke="#334155" stroke-width="5" fill="none" />
  
  <!-- Neck -->
  <rect x="135" y="195" width="30" height="55" rx="6" fill="#6f3d23" />
  <path d="M135,215 C145,225 155,225 165,215" stroke="#5a311b" stroke-width="2" fill="none" />

  <!-- Ears -->
  <ellipse cx="98" cy="155" rx="9" ry="16" fill="#6f3d23" />
  <ellipse cx="98" cy="155" rx="5" ry="9" fill="#5a311b" />
  <ellipse cx="202" cy="155" rx="9" ry="16" fill="#6f3d23" />
  <ellipse cx="202" cy="155" rx="5" ry="9" fill="#5a311b" />

  <!-- Face Contour -->
  <path d="M102,130 C102,85 198,85 198,130 C198,185 180,215 150,215 C120,215 102,185 102,130 Z" fill="url(#skinGrad)" />

  <!-- Short Fade Haircut -->
  <path d="M100,120 C98,75 120,62 150,62 C180,62 202,75 200,120 C195,90 175,76 150,76 C125,76 105,90 100,120 Z" fill="#090d16" />
  <path d="M100,110 C100,85 125,70 150,70 C175,70 200,85 200,110 Z" fill="#171923" />

  <!-- Eyebrows -->
  <path d="M116,132 Q130,126 140,132" stroke="#171923" stroke-width="3.5" stroke-linecap="round" fill="none" />
  <path d="M160,132 Q170,126 184,132" stroke="#171923" stroke-width="3.5" stroke-linecap="round" fill="none" />

  <!-- Eyes with warm light reflection -->
  <ellipse cx="128" cy="144" rx="7" ry="5.5" fill="#ffffff" />
  <circle cx="128" cy="144" r="3.5" fill="#1c1917" />
  <circle cx="129.5" cy="142.5" r="1.2" fill="#ffffff" />

  <ellipse cx="172" cy="144" rx="7" ry="5.5" fill="#ffffff" />
  <circle cx="172" cy="144" r="3.5" fill="#1c1917" />
  <circle cx="173.5" cy="142.5" r="1.2" fill="#ffffff" />

  <!-- Stylish Acetate Glasses Frame -->
  <rect x="114" y="132" width="30" height="24" rx="6" fill="none" stroke="#090d16" stroke-width="2.5" />
  <rect x="156" y="132" width="30" height="24" rx="6" fill="none" stroke="#090d16" stroke-width="2.5" />
  <line x1="144" y1="142" x2="156" y2="142" stroke="#090d16" stroke-width="2.5" />
  <line x1="102" y1="140" x2="114" y2="140" stroke="#090d16" stroke-width="2.5" />
  <line x1="186" y1="140" x2="198" y2="140" stroke="#090d16" stroke-width="2.5" />

  <!-- Nose -->
  <path d="M147,150 L146,168 C146,172 154,172 154,168 L153,150" stroke="#5a311b" stroke-width="2" fill="none" />
  
  <!-- Warm Confident Smile -->
  <path d="M136,186 Q150,196 164,186" stroke="#451a03" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M140,186 Q150,193 160,186" fill="#ffffff" />

  <!-- Light Beard / Stubble Shadow -->
  <path d="M125,188 C135,210 165,210 175,188" stroke="#3e2316" stroke-width="3" stroke-dasharray="1 3" fill="none" opacity="0.6"/>
</svg>
