<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" width="100%" height="100%">
  <defs>
    <linearGradient id="jmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="skinJames" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fdba74" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="300" height="340" fill="url(#jmBg)" rx="16" />

  <!-- Studio Light Aura -->
  <circle cx="150" cy="130" r="110" fill="#475569" opacity="0.35" />

  <!-- Shoulders & Dark Tech Crewneck -->
  <path d="M50,340 C60,265 105,245 150,245 C195,245 240,265 250,340 Z" fill="#090d16" />
  <path d="M125,245 C135,260 165,260 175,245" stroke="#1e293b" stroke-width="4" fill="none" />
  
  <!-- Neck -->
  <rect x="135" y="195" width="30" height="55" rx="5" fill="#fdba74" />

  <!-- Ears -->
  <ellipse cx="98" cy="155" rx="8" ry="15" fill="#fdba74" />
  <ellipse cx="202" cy="155" rx="8" ry="15" fill="#fdba74" />

  <!-- Face Contour -->
  <path d="M104,130 C104,85 196,85 196,130 C196,180 180,215 150,215 C120,215 104,180 104,130 Z" fill="url(#skinJames)" />

  <!-- Modern Short Styled Hair -->
  <path d="M100,120 C96,70 120,55 150,55 C180,55 204,70 200,120 C194,80 170,70 150,70 C130,70 106,80 100,120 Z" fill="#292524" />
  <path d="M102,105 C108,75 135,62 165,65 C175,66 188,72 196,82 C185,75 165,72 145,74 C125,76 112,88 102,105 Z" fill="#44403c" />

  <!-- Eyebrows -->
  <path d="M116,132 Q130,126 142,130" stroke="#292524" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M158,130 Q170,126 184,132" stroke="#292524" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Focused Eyes -->
  <ellipse cx="129" cy="142" rx="7" ry="5.5" fill="#ffffff" />
  <circle cx="129" cy="142" r="3.5" fill="#1e3a8a" />
  <circle cx="130" cy="140" r="1.3" fill="#ffffff" />

  <ellipse cx="171" cy="142" rx="7" ry="5.5" fill="#ffffff" />
  <circle cx="171" cy="142" r="3.5" fill="#1e3a8a" />
  <circle cx="172" cy="140" r="1.3" fill="#ffffff" />

  <!-- Nose -->
  <path d="M148,145 L146,165 C146,168 154,168 154,165 L152,145" stroke="#fba768" stroke-width="2" fill="none" />
  
  <!-- Well-groomed Full Beard & Mustache -->
  <path d="M106,155 C106,205 125,225 150,225 C175,225 194,205 194,155 C190,175 180,185 170,185 C165,185 160,180 150,180 C140,180 135,185 130,185 C120,185 110,175 106,155 Z" fill="#292524" />
  <!-- Mustache -->
  <path d="M136,174 C142,168 147,172 150,174 C153,172 158,168 164,174 C158,180 142,180 136,174 Z" fill="#1c1917" />
  
  <!-- Friendly Smile in Beard -->
  <path d="M138,186 Q150,195 162,186" stroke="#ffffff" stroke-width="2.5" fill="none" />
</svg>
